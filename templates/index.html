<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theoforge</title>
  <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Theoforge Launching Soon</h1>
      <p>Something exciting is coming your way! Be the first to know when we launch.</p>
    </div>
  </div>

  <h1>Contact Us</h1>

  <form id="contact-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>

      <button type="submit">Submit</button>
  </form>

  <p id="response-message"></p>


</body>
<footer>
    <p>2025 Theoforge: {{ environment }}</p>
</footer>


<script>
var request = new XMLHttpRequest()

request.open('GET', 'https://dev.theoforge.com/API/', true)
request.onload = function () {
  // Begin accessing JSON data here
  var data = JSON.parse(this.response)

  if (request.status >= 200 && request.status < 400) {
      console.log(data);
  } else {
    console.log('error')
  }
}

request.send()

</script>
</html>
