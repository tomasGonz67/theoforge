<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theoforge</title>
  <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Theoforge Launching Soon</h1>
      <p>Something exciting is coming your way! Be the first to know when we launch.</p>
    </div>
  </div>

  <h1>Contact Us</h1>

  <form id="contact-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>

      <button type="submit">Submit</button>
  </form>

  <p id="response-message"></p>


</body>
<footer>
    <p>2025 Theoforge: {{ environment }}</p>
</footer>


<script>
var request = new XMLHttpRequest()

request.open('GET', 'https://dev.theoforge.com/API/', true)
request.onload = function () {
  // Begin accessing JSON data here
  var data = JSON.parse(this.response)

  if (request.status >= 200 && request.status < 400) {
      console.log(data);
  } else {
    console.log('error')
  }
}

request.send()

const form = document.getElementById('contact-form');

form.addEventListener('submit', async (event) => {
    event.preventDefault(); // Prevent the form from refreshing the page

    // Get the values from the form
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    try {
        // Send a POST request to the FastAPI endpoint
        const response = await fetch('https://dev.theoforge.com/API/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`
        });

        // Check if the response is successful
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }

        // Parse the JSON response
        const data = await response.json();

        // Display the response (access token)
        console.log(data);
        alert(`Access Token: ${data.name}`);

    } catch (error) {
        console.error('There was a problem with the fetch operation:', error);
    }
  });

</script>
</html>
